[theme]
primaryColor = "#1DB954"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#FAFAFA"
# Refined-dark type system. The families are loaded in <head> by
# src/og_meta.py; these settings make Streamlit's own chrome AND the
# Plotly charts (which inherit theme.font) use them. Each carries a
# generic fallback so a failed font fetch degrades cleanly.
font = "IBM Plex Sans, sans-serif"
headingFont = "Archivo, sans-serif"
codeFont = "IBM Plex Mono, monospace"

[client]
toolbarMode = "minimal"

[server]
headless = true
